name: Build & publish Docker image

# Publishes ly2xxx/md-mcp to Docker Hub.
#
# - Push a version tag (e.g. `git tag v1.0.5 && git push --tags`)  -> pushes :1.0.5 and :latest
# - Manual run (Actions tab -> Run workflow)                       -> pushes :latest
# - Pull request touching the image                               -> build only (no push), as a smoke test
#
# Requires two repo secrets (Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME  = ly2xxx
#   DOCKERHUB_TOKEN     = a Docker Hub access token with Read/Write/Delete (Account -> Security)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - "docker/**"
      - "md_mcp/**"
      - "pyproject.toml"
      - ".github/workflows/docker-publish.yml"

env:
  IMAGE: ly2xxx/md-mcp
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (for multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build timestamp
        id: ts
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Derive tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' }}

      # Only authenticate when we actually intend to push.
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.ts.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Sync the Docker Hub repo overview + short description from docker/DOCKERHUB.md.
      # (Categories are UI-only and cannot be set here.)
      - name: Update Docker Hub description
        if: github.event_name != 'pull_request'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE }}
          short-description: "Expose local Markdown folders to Claude & any MCP client — no embeddings, no uploads, real-time."
          readme-filepath: ./docker/DOCKERHUB.md
