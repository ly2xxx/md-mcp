# Convenience compose file for running md-mcp on local Docker Desktop.
#
#   cd docker
#   docker compose up --build
#
# Point it at your own markdown folder by setting MD_HOST_FOLDER, e.g. (PowerShell):
#   $env:MD_HOST_FOLDER="C:/Users/you/notes"; docker compose up --build
#
# The build context is the repo root (..) because the image needs the md_mcp package.

services:
  md-mcp:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        # Set to "true" to bake in semantic/hybrid search (large image).
        INSTALL_SEMANTIC: "false"
    image: md-mcp:local
    container_name: md-mcp
    ports:
      - "8000:8000"
    environment:
      MD_FOLDER: /data
      MD_NAME: markdown-docs
      MD_TRANSPORT: http
      MD_HOST: 0.0.0.0
      MD_PORT: "8000"
      MD_PATH: /mcp
      # Uncomment to export OpenTelemetry traces/metrics to a collector on the
      # host (e.g. an otel-collector + Tempo/Prometheus/Grafana stack).
      # Telemetry stays off while this is unset. See README "Observability".
      # OTEL_EXPORTER_OTLP_ENDPOINT: http://host.docker.internal:4317
      # OTEL_SERVICE_NAME: md-mcp
    volumes:
      # Defaults to the bundled sample docs; override with MD_HOST_FOLDER.
      # Always read-only: the semantic embedding cache is written to
      # MD_CACHE_DIR (default ~/.cache/md-mcp inside the container), never
      # into the notes folder. Mount a volume there to persist it across runs.
      - "${MD_HOST_FOLDER:-./sample-docs}:/data:ro"
    restart: unless-stopped
