apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "md-mcp.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "md-mcp.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "md-mcp.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "md-mcp.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: MD_FOLDER
              value: "/data"
            - name: MD_NAME
              value: {{ .Values.mdName | quote }}
            - name: MD_TRANSPORT
              value: "http"
            - name: MD_PORT
              value: "8000"
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: notes-volume
              mountPath: /data
              readOnly: true
      volumes:
        - name: notes-volume
          hostPath:
            path: {{ .Values.mdFolder | quote }}
            type: Directory
