replicaCount: 1

image:
  repository: ly2xxx/md-mcp
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000

# Mount local folder into Docker Desktop k8s pods. 
# Adjust this to match your actual Windows path syntax supported by Docker Desktop (e.g. /run/desktop/mnt/host/c/Users/... or direct path depending on version).
# A direct Windows path often works directly in Docker Desktop.
mdFolder: "/run/desktop/mnt/host/h/code/yl/md-mcp/kubernetes"
# The name to display in MCP client
mdName: "k8s-notes"

resources:
  # Resources are REQUIRED for HorizontalPodAutoscaler to function
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "256Mi"

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  # targetMemoryUtilizationPercentage: 80
